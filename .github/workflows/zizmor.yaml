name: Zizmor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The action fails the build on any finding by default. It also uploads
      # results to the Security tab via SARIF (advanced-security defaults to true;
      # code scanning is free for public repos).
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
